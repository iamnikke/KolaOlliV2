<html>
<body>
<h1>Hello World!</h1>
<span id="asd"></span>

<script>
    async function getMoi() {
        const userId = 1;

        const res = await fetch(`http://localhost:5050/api/get_user_location?user_id=${userId}`);
        const data = await res.json();

        console.log(data);

        document.getElementById("asd").innerHTML = data.location;
    }

    getMoi();
</script>
</body>
</html>
