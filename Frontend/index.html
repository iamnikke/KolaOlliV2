<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="UTF-8">
        <link href="css/style.css" rel="stylesheet">
        <title>s</title>
        <script src="flight_menu.js" defer></script>
    </head>
<body>
<h1>Hello World!</h1>
<span id="asd"></span>

<div class="ui-card">
    <p>massit</p>
    <span id="ui-money"></span>
</div>
<div class="ui-card">
    <p>colat</p>
    <span id="ui-cola"></span>
</div>
<div class="ui-card">
    <p>kello</p>
    <span id="ui-clock"></span>
</div>
<div class="ui-card">
    <p>sijainti</p>
    <span id="ui-location"></span>
</div>

<div class="ui-card">
    <p>kokonaismatka</p>
    <span id="ui-total-travel"></span>
</div>


<button class="ui-select-country" id="LOWW">Austria</button>
<button class="ui-select-country" id="EBBR">Bryssel, Belgium</button>
<button class="ui-select-country" id="LEMD">Madrid, Espanja</button>
<button class="ui-select-country" id="LIRF">Rooma, Italia</button>


<!--

    allowedCountries = {
        'Austria': 'LOWW',
        'Bryssel, Belgium': 'EBBR',
        'Madrid, Espanja': 'LEMD',
        'Rooma, Italia': 'LIRF',
        'Luxemburg, Luxemburg': 'ELLX',
        'Varsova, Puola': 'EPWA',
        'Pariisi, Ranska': 'LFPG',
        'Kööpenhamina, Tanska': 'EKCH',
        'Ateena, Kreikka': 'LGAV',
        'Minsk, Valko-Venäjä': 'UMMS',
        'Viro, Tallinna': 'EETN',
    }


    -->

<form id="authForm">
    <input type="text" id="username" name="username" placeholder="Username"/>
    <button type="submit">Submit</button>
</form>


<div class="ui-flight-container" style="border: solid 1px black">

    <h1 class="ui-flight-title" id="ui-flight-title">Kohdemaa</h1>

    <p>Etäisyys: <span id="ui-flight-distance">0</span> km</p>
    <p>Hinta (menopaluu): <span id="ui-flight-cost">0</span> €</p>

    <h3 class="ui-selection-label">Valitse lentokone:</h3>

    <div class="airplane-selector">

        <div class="plane-card selected" data-index="0" onclick="selectPlane(this)">
            <span class="plane-name">Pieni</span>
            <span class="plane-speed">1000 km/h</span>
            <span class="plane-capacity">50 tölkkiä</span>
        </div>

        <div class="plane-card" data-index="1" onclick="selectPlane(this)">
            <span class="plane-name">Keskikoko</span>
            <span class="plane-speed">1500 km/h</span>
            <span class="plane-capacity">100 tölkkiä</span>
        </div>

        <div class="plane-card" data-index="2" onclick="selectPlane(this)">
            <span class="plane-name">Suuri</span>
            <span class="plane-speed">2000 km/h</span>
            <span class="plane-capacity">300 tölkkiä</span>
        </div>

    </div>
    <input type="hidden" id="selected-plane-index" value="0">

</div>

<script>

    // helper to get ?username=...
    function getUsernameFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get("username");
    }

    const username = getUsernameFromURL();

    // if no username → show form, hide HUD
    if (!username) {
        document.querySelectorAll(".ui-card").forEach(el => el.style.display = "none");
    } else {
        // hide form
        document.getElementById("authForm").style.display = "none";

        // fetch user data
        fetch(`http://localhost:5050/api/authenticate?username=${username}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById("ui-money").innerHTML = data.money;
                document.getElementById("ui-cola").innerHTML = data.coca_cola;
                document.getElementById("ui-clock").innerHTML = data.clock;
                document.getElementById("ui-location").innerHTML = data.location;
                document.getElementById("ui-total-travel").innerHTML = data.total_travel_km;
            });
    }

    document.querySelectorAll(".ui-select-country").forEach(btn => {
        btn.addEventListener("click", (e) => {
            const icao = e.currentTarget.id;

            fetch(`http://localhost:5050/api/get_flight_info?icao=${icao}`)
                .then(res => res.json())
                .then(data => {
                    console.log(data)

                    document.getElementById("ui-flight-title").innerHTML = data.from + "->" + data.to
                    document.getElementById("ui-flight-distance").innerHTML = data.distance

                });
        });

    });


    // when submitting form → reload page with ?username=
    document.getElementById("authForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value;

        if (username) {
            window.location.href = `?username=${username}`;
        }
    });

</script>
</body>
</html>
